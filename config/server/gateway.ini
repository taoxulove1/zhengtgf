; 网关（GatewayServer）配置 —— 实测回填，证据 docs/deploy/server-env.md §3/§6
[gateway]
; 实测：进程起来时 6020 未监听，Scenes 就位后才 LISTEN（2026-11-27 08:20 复核）
listen_port = 6020
bind = 10.1.0.10
backlog = 128
max_conn = 2000
recv_buf_kb = 64
send_buf_kb = 64
idle_kick_sec = 60
; 单包上限受帧头 bit23-0 限制，理论最大 0x00FFFFFF，实际取 64 KB 更安全
max_packet_bytes = 65535
; 0:不排序 1:在线人数 2:注册人数（实测 config.xml <countryorder>2</countryorder>）
country_order = 2
; 角色名唯一性校验服务器，实测 0 = 关闭
rolereg_verify = 0

[upstream]
session_host = 10.1.0.10
session_port = 6001
scenes_host = 10.1.0.10
scenes_port = 6010
super_host = 10.1.0.10
super_port = 10000

[files]
scene_info = scenesinfo.xml
forbid_words = forbidWords
gm_ip = gm_conf.xml
