; 登录服（FlServer）配置 —— 实测回填，证据 docs/deploy/server-env.md §3/§4
[login]
; 客户端登录口（外网），对应 config.xml 的 <login_port>
listen_port = 8000
; 服间内联，对应 <inside_port>
inside_port = 8001
; 客户端 PING，对应 <ping_port>
ping_port = 8002
bind = 10.1.0.10
max_conn = 5000
auth_timeout_sec = 20
allow_multi_login = false
; 实测 <jpeg_passport>false</jpeg_passport>，图形验证码关闭
jpeg_passport = false
; 网关最大连接数 0 表示无限制
max_gateway_user = 0

[version]
; 客户端版本校验，与 imversion.ini / patchsetup.ini 对齐
expect = 3.1.46.0
check_enable = true
; GAME_VERSION 常量在 Command.h 中为 1999；0x0101 实际 payload 是版本字符串，二者都要认
game_version_const = 1999

[db]
host = 127.0.0.1
port = 3307
name = Zebra
user = test
password = ${DB_PASSWORD}
charset = gbk

; 区信息与服务器列表文件（相对 /root/zt/server）
[files]
zone_info = zoneInfo.xml
login_server_list = loginServerList.xml
db_access_server_list = dbAccessServerList.xml
