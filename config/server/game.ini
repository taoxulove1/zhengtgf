; 服务端主配置模板 —— 落地前由 P4B 按实测回填
; 端口来源：7001 为假设值，待 P1 抓包确认；10000 为 SuperServer 实测
[server]
name = zhengtugf-test
zone_id = 1
listen_port = 7001
super_port = 10000
max_conn = 2000
heartbeat_sec = 15
timeout_sec = 30

[database]
host = 192.168.1.11
port = 3306
name = zt_game
user = game
password = ${DB_PASSWORD}
charset = gbk

[log]
level = info
path = /opt/game/logs
rotate_mb = 50
keep = 7
hexdump_bytes = 64
