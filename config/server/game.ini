; 服务端主配置 —— 数值全部来自 2026-11-27 对 101.33.**.** 的实测
; 证据：docs/deploy/server-env.md §3 端口矩阵、§4 关键配置
; 落地目标：/root/zt/server/config.xml（GB2312 编码，勿用 UTF-8 直接覆盖）
[server]
name = 征途
zone_id = 1
zone_game = 0
super_port = 10000
super_host = 10.1.0.10
; 绑定网卡地址（实测 eth0 = 10.1.0.10/22，必须真实存在，否则绑定失败）
ifname = 10.1.0.10
max_conn = 2000
; 内部链路心跳实测 1 帧/秒、14 字节/帧（见 protocol.md §0.5）
heartbeat_sec = 1
timeout_sec = 60
; 服务标志位 1邮件 2拍卖 4特征码 8送马
service_flag = 15
; 登录成功后下发的特征码文件
process_file = process.dat
gm_mode = 10
merge_version = 1
exp_rate = 10
drop_rate = 10

[ports]
fl_login = 8000
fl_inside = 8001
fl_ping = 8002
session = 6001
gateway = 6020
scenes = 6010
mini = 6012
record = 7010
bill = 7020
bill_client = 9967
super = 10000

[database]
; 实测：Wine 版 MySQL 4.0，端口 3307，无 information_schema 表
host = 127.0.0.1
port = 3307
name = Zebra
user = test
password = ${DB_PASSWORD}
charset = gbk
; ShowCharbase / LoadLogServer 工具段用 root，实测配置内口令已失效
tool_user = root
tool_password = ${DB_ROOT_PASSWORD}

[log]
level = debug
path = log/superserver
rotate_mb = 50
keep = 7
; 日志编码 GB18030，读取一律 iconv -f GB18030 -t UTF-8
encoding = GB18030
