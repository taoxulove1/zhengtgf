name: 数据变更
description: 客户端资源 / 配置 / 数据库数据的增删改
title: "[DATA] "
labels: ["data:change"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 范围
      options:
        - 客户端资源（.pak / .ghd / 音频）
        - 客户端文本配置（xml / ini）
        - 服务端配置（config/server）
        - 数据库结构与数据（sql）
        - 资产清单（assets/manifest）
    validations:
      required: true

  - type: input
    id: count
    attributes:
      label: 变更文件数 / 总体积
      placeholder: 3 个 / 412.6 MB
    validations:
      required: true

  - type: textarea
    id: diff
    attributes:
      label: 变更明细
      description: 路径 → 旧 sha256 → 新 sha256（可只列前 8 位）
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 复核项
      options:
        - label: 已重跑 gen-manifest.py
          required: true
        - label: verify-assets.py 全量 0 差异
          required: true
        - label: 大资源已切 90 MB 分卷并上传 Release
          required: false
        - label: 已指定 2 名复核人（1 名 CODEOWNER）
          required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚方式
      placeholder: 用上一版 Release 分卷还原 + git revert 清单提交
    validations:
      required: true
